<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai01.html</title>
    <style>
        body {
            display: flex;
            justify-content: center;
        }

        .khung-tho {
            width: 640px;
            background: #FFFDE7;
            border: 1px solid #9E9E9E;
            padding: 24px;
            text-align: center;
        }

        h1 {
            color: #D40000;
            background: #FFD9E6;
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px;
            text-align: center;
        }
        .kho-xanh {
            color: #0033CC;
            font-style: italic;
            line-height: 1.7;
        }
        .kho-do {
            color: #D40000;
            font-style: italic;
            line-height: 1.7;
        }

        hr {
            width: 55%;
            border: none;
            border-top: 1px solid #0033CC;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <article class="khung-tho">
        <h1>BỐN MÙA</h1>

        <p class="kho-xanh">
            Xuân về hoa nở khắp trời <br>
            Hạ sang nắng cháy rạng ngời phố quen <br>
            Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ <br>
            Bốn mùa là bốn giấc mơ <br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-xanh">
            Một năm rồi lại một năm <br>
            Vẫn còn câu hát thì thầm quê hương <br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>
</body>
</html>
